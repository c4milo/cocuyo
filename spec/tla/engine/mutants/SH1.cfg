\* expect: violated
\* module: EngineMutants
\* The last lookup to leave a connection during a query's send leaves it up, as until 2026-10-25
\* (docs/mutations.md SH1). The query's send then holds the lookup's buffer on a connection that
\* no lookup is on, until the idle close.
CONSTANTS
    Servers = 2
    Slots = 1
    Conns = 1
    PollsMax = 1000
    TimeoutTicks = 2
    UseTcp = TRUE
    PerPort = 0
    Tls = FALSE
    Request = FALSE
    Channel = FALSE
    OpsMax = 4
    FailuresMax = 1
    SentMax = 3
    LeaveShuts <- LeaveShutsNever
INIT Init
NEXT Next
INVARIANT Clean
CHECK_DEADLOCK FALSE
