\* expect: violated
\* module: EngineMutants
\* In the clear, no connection that no lookup is on is closed while its connect is in flight
\* (docs/mutations.md TS18). The connect of a lookup's last try then holds the one slot, and the
\* lookup at the next server is told at once.
CONSTANTS
    Servers = 2
    Slots = 1
    Conns = 1
    PollsMax = 1000
    TimeoutTicks = 2
    UseTcp = TRUE
    PerPort = 0
    Tls = FALSE
    Request = FALSE
    Channel = FALSE
    OpsMax = 4
    FailuresMax = 1
    SentMax = 3
    FreeConn <- FreeConnKeepingConnects
INIT Init
NEXT Next
INVARIANT Clean
CHECK_DEADLOCK FALSE
