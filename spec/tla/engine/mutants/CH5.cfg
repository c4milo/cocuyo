\* expect: violated
\* module: EngineMutants
\* A channel's close drops the requests that waited for the next, which opens none (CH5, rule
\* 24).
CONSTANTS
    Servers = 1
    Slots = 1
    Conns = 0
    PollsMax = 1000
    TimeoutTicks = 2
    UseTcp = FALSE
    PerPort = 0
    Tls = FALSE
    Request = TRUE
    Channel = TRUE
    OpsMax = 3
    FailuresMax = 1
    SentMax = 0
    ChanClosed <- ChanClosedDropping
INIT Init
NEXT Next
INVARIANT Clean
CHECK_DEADLOCK FALSE
