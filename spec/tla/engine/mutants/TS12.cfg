\* expect: violated
\* module: EngineMutants
\* Only a connection that closes is pending, and a slot the loop borrows is not
\* (docs/mutations.md TS12). In the clear a cancelled connect borrows its slot.
CONSTANTS
    Servers = 2
    Slots = 1
    Conns = 1
    PollsMax = 1000
    TimeoutTicks = 2
    UseTcp = TRUE
    PerPort = 0
    Tls = FALSE
    Request = FALSE
    Channel = FALSE
    OpsMax = 4
    FailuresMax = 1
    SentMax = 3
    Pending <- PendingClosing
INIT Init
NEXT Next
INVARIANT Clean
CHECK_DEADLOCK FALSE
