\* expect: violated
\* module: EngineMutants
\* No deadline bounds `tcpReady`, as until 2026-10-24 (docs/mutations.md RD1). A lookup whose
\* query's send never ends then stays in that stage after the clock passes its deadline.
CONSTANTS
    Servers = 2
    Slots = 1
    Conns = 1
    PollsMax = 1000
    TimeoutTicks = 2
    UseTcp = TRUE
    PerPort = 0
    Tls = FALSE
    Request = FALSE
    Channel = FALSE
    OpsMax = 4
    FailuresMax = 1
    SentMax = 3
    Waiting <- WaitingUnbounded
INIT Init
NEXT Next
INVARIANT Clean
CHECK_DEADLOCK FALSE
