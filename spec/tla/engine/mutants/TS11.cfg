\* expect: violated
\* module: EngineMutants
\* No slot is ever pending. So a lookup that finds no free slot is told at once, as the engine did
\* until 2026-10-18 (docs/mutations.md TS11). Over TLS a slot is pending whenever none is free.
CONSTANTS
    Servers = 2
    Slots = 1
    Conns = 2
    PollsMax = 1000
    TimeoutTicks = 2
    UseTcp = TRUE
    PerPort = 0
    Tls = TRUE
    Request = FALSE
    Channel = FALSE
    OpsMax = 2
    FailuresMax = 1
    SentMax = 3
    Pending <- PendingNever
INIT Init
NEXT Next
INVARIANT Clean
CHECK_DEADLOCK FALSE
