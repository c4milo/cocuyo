\* expect: violated
\* module: EngineMutants
\* Over TLS only a send of the session's own records names the records buffer that it reads, as
\* `Pump` did until 2026-10-18 (docs/mutations.md TB8). A query's send names none, so it borrows no
\* slot, and a slot whose connection failed during that send opens again.
CONSTANTS
    Servers = 2
    Slots = 1
    Conns = 2
    PollsMax = 1000
    TimeoutTicks = 2
    UseTcp = TRUE
    PerPort = 0
    Tls = TRUE
    Request = FALSE
    Channel = FALSE
    OpsMax = 2
    FailuresMax = 1
    SentMax = 3
    SendFrom <- SendFromRecordsOnly
INIT Init
NEXT Next
INVARIANT Clean
CHECK_DEADLOCK FALSE
