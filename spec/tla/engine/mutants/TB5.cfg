\* expect: violated
\* module: EngineMutants
\* Only a connect or a send of the session's own records borrows its slot, as until 2026-10-18
\* (docs/mutations.md TB5). A connection that fails during a query's send then leaves its slot
\* free, and a new opening takes it while the loop still reads its records buffer.
CONSTANTS
    Servers = 2
    Slots = 1
    Conns = 2
    PollsMax = 1000
    TimeoutTicks = 2
    UseTcp = TRUE
    PerPort = 0
    Tls = TRUE
    Request = FALSE
    Channel = FALSE
    OpsMax = 2
    FailuresMax = 1
    SentMax = 3
    Borrowed <- BorrowedBeforeQueries
INIT Init
NEXT Next
INVARIANT Clean
CHECK_DEADLOCK FALSE
