\* expect: violated
\* module: EngineMutants
\* The last leave of a marked connection whose sends ended leaves it up, for the idle close
\* (docs/mutations.md NJ3). No lookup may join it, so it holds its slot for nobody.
CONSTANTS
    Servers = 2
    Slots = 2
    Conns = 1
    PollsMax = 1000
    TimeoutTicks = 2
    UseTcp = TRUE
    PerPort = 0
    Tls = FALSE
    Request = FALSE
    Channel = FALSE
    OpsMax = 4
    FailuresMax = 1
    SentMax = 3
    Leave <- LeaveKeepingMarked
INIT Init
NEXT Next
INVARIANT Clean
CHECK_DEADLOCK FALSE
