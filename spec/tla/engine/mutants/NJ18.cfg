\* expect: violated
\* module: EngineMutants
\* Over TLS the last leave of a marked connection whose sends ended shuts it, and the peer hears no
\* close_notify (docs/mutations.md NJ18). One server, two lookups, one connection.
CONSTANTS
    Servers = 1
    Slots = 2
    Conns = 1
    PollsMax = 1000
    TimeoutTicks = 2
    UseTcp = TRUE
    PerPort = 0
    Tls = TRUE
    Request = FALSE
    Channel = FALSE
    OpsMax = 2
    FailuresMax = 1
    SentMax = 3
    EndMarked <- EndMarkedShut
INIT Init
NEXT Next
INVARIANT Clean
CHECK_DEADLOCK FALSE
