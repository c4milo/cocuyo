\* expect: violated
\* module: EngineMutants
\* A link's socket that ends fails every request on its channel itself, before the channel says
\* what that ended (CH8, rule 19).
CONSTANTS
    Servers = 1
    Slots = 1
    Conns = 0
    PollsMax = 1000
    TimeoutTicks = 2
    UseTcp = FALSE
    PerPort = 0
    Tls = FALSE
    Request = TRUE
    Channel = TRUE
    OpsMax = 3
    FailuresMax = 1
    SentMax = 0
    LinkEnded <- LinkEndedFailing
INIT Init
NEXT Next
INVARIANT Clean
CHECK_DEADLOCK FALSE
