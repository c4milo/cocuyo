\* expect: holds
\* TLS, one slot and two connections, at two operations and no failure: spec/README.md's first
\* TLS row. TLC counted its 51,406 states, as the Lean walker had, until a refusal said its alert
\* and a connection up could refuse a record, and 68,678 from then (2026-09-27, c4milo/cocuyo#31)
\* until a SERVFAIL counted against its server, and 15,449 since (2026-10-08, c4milo/cocuyo#37).
\* Since then it reaches the first server alone. Every way to the next server records a failure, a
\* SERVFAIL as well, and a bound of no failure stops the walk at the first: no state TLC walks from
\* has a lookup on the second server or a connection open to it. `Engine_tls_1_2_bound_2_1` still
\* reaches it (spec/README.md).
CONSTANTS
    Servers = 2
    Slots = 1
    Conns = 2
    PollsMax = 1000
    TimeoutTicks = 2
    UseTcp = TRUE
    PerPort = 0
    Tls = TRUE
    Request = FALSE
    Channel = FALSE
    OpsMax = 2
    FailuresMax = 0
    SentMax = 3
INIT Init
NEXT Next
INVARIANT Clean
CHECK_DEADLOCK FALSE
