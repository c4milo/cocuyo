\* expect: holds
\* TLS, two lookups, and a connection for each server (§21, TLS rule 6). Since 2026-10-08
\* (c4milo/cocuyo#37) it reaches the first server alone. Every way to the next server records a
\* failure, a SERVFAIL as well, and a bound of no failure stops the walk at the first: no state TLC
\* walks from has a lookup on the second server or a connection open to it (spec/README.md).
CONSTANTS
    Servers = 2
    Slots = 2
    Conns = 2
    PollsMax = 1000
    TimeoutTicks = 2
    UseTcp = TRUE
    PerPort = 0
    Tls = TRUE
    Request = FALSE
    Channel = FALSE
    OpsMax = 2
    FailuresMax = 0
    SentMax = 3
INIT Init
NEXT Next
INVARIANT Clean
CHECK_DEADLOCK FALSE
