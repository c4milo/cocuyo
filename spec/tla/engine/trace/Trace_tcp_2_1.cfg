\* The engine's walks for the replay over TCP, two slots and one connection: TLC's simulation
\* mode, which `zig build spec` runs; `zig build tla` does not read this directory.
CONSTANTS
    Servers = 2
    Slots = 2
    Conns = 1
    PollsMax = 1000
    TimeoutTicks = 2
    UseTcp = TRUE
    PerPort = 0
    Tls = FALSE
    OpsMax = 0
    FailuresMax = 0
    SentMax = 0
INIT TraceInit
NEXT TraceNext
INVARIANT Clean
CHECK_DEADLOCK FALSE
