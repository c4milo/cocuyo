\* expect: holds
\* UDP, two lookups sharing a server's socket, a port replaced every two queries. Since 2026-10-08
\* (c4milo/cocuyo#37) it reaches the first server alone. Every way to the next server records a
\* failure, a SERVFAIL as well, and a bound of no failure stops the walk at the first: no state TLC
\* walks from has a lookup on the second server (spec/README.md).
CONSTANTS
    Servers = 2
    Slots = 2
    Conns = 1
    PollsMax = 1000
    TimeoutTicks = 2
    UseTcp = FALSE
    PerPort = 2
    Tls = FALSE
    Request = FALSE
    Channel = FALSE
    OpsMax = 4
    FailuresMax = 0
    SentMax = 3
INIT Init
NEXT Next
INVARIANT Clean
CHECK_DEADLOCK FALSE
