\* expect: holds
\* UDP, two lookups sharing a server's socket, a port replaced every two queries. At four
\* operations and no failure TLC counted 1,534,175 states until a SERVFAIL counted against its
\* server, and 64,745 after (2026-10-08, c4milo/cocuyo#37), the second server out of its reach:
\* every way to the next server records a failure. At one failure since 2026-10-09 it reaches the
\* second server again (spec/README.md).
\* nightly: 13,390,228 states, which TLC took 13 minutes over on ten cores of an Apple M1 Pro while
\* other work ran. CI checks it once a day (.github/workflows/tla-nightly.yml), and every
\* configuration without this line on each push. Since a lookup keeps each try of a name open, and a
\* socket that drains stays open for an open try's answer, it counts 19,053,349 (2026-11-04, §16
\* decision 66). TLC took 7 hours and 39 minutes over them on six cores while other models' checks
\* ran on the same machine, which says little of its rate alone.
\* Since each place holds one operation in flight (docs/design.md §26), it counts 19,949,045
\* (2026-11-12).
