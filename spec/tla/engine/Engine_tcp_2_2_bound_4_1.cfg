\* expect: holds
\* TCP, two lookups and two connections, one a server. At four operations and no failure it held
\* 223,428 states until a SERVFAIL counted against its server, and 59,420 after (2026-10-08,
\* c4milo/cocuyo#37), the second server out of its reach: every way to the next server records a
\* failure. At one failure since 2026-10-09 it reaches the second server again, and TLC counts
\* 2,438,035 states, in 187 seconds on ten cores of an Apple M1 Pro while other work ran
\* (spec/README.md). Since a lookup that finds no free slot waits for one that frees on its own, it
\* counted 3,466,275 (2026-10-18, the stream's rule 12). Since a deadline ends `tcpReady`, it
\* counted 3,583,539 (2026-10-24, §16 decision 52). Since the last leave during a query's send
\* shuts the connection, it counts 2,936,207 (2026-10-25, §16 decision 53).
CONSTANTS
    Servers = 2
    Slots = 2
    Conns = 2
    PollsMax = 1000
    TimeoutTicks = 2
    UseTcp = TRUE
    PerPort = 0
    Tls = FALSE
    Request = FALSE
    Channel = FALSE
    OpsMax = 4
    FailuresMax = 1
    SentMax = 3
INIT Init
NEXT Next
INVARIANT Clean
CHECK_DEADLOCK FALSE
