\* expect: holds
\* DoQ or DoH, one lookup and two servers: a failed request moves the lookup to the other connection.
\* Since a lookup keeps an earlier try's request in a slot of the request pool (§16 decision 66, the
\* owner's ruling of 2026-11-05), it reaches the earlier try's answer and the pool's eviction.
\* nightly: 7,822,686 states, which TLC took 55 minutes over on eight cores of an Apple M1 Pro on
\* 2026-11-05. CI checks it once a day (.github/workflows/tla-nightly.yml), and every configuration
\* without this line on each push.
\* Since each place holds one operation in flight (docs/design.md §26), it counts 7,783,030
\* (2026-11-12).
CONSTANTS
    Servers = 2
    Slots = 1
    Conns = 0
    PollsMax = 1000
    TimeoutTicks = 2
    UseTcp = FALSE
    PerPort = 0
    Tls = FALSE
    Request = TRUE
    Channel = FALSE
    OpsMax = 3
    FailuresMax = 1
    SentMax = 0
INIT Init
NEXT Next
INVARIANT Clean
CHECK_DEADLOCK FALSE
