\* expect: holds
\* TLS, one lookup and two connections at three operations. At no failure the Lean walker counted
\* 1,164,712 states, TLC 2,138,766 once a refusal said its alert (2026-09-27, c4milo/cocuyo#31),
\* and 286,964 once a SERVFAIL counted against its server (2026-10-08, c4milo/cocuyo#37), the
\* second server out of its reach: every way to the next server records a failure. At one failure
\* since 2026-10-09 it reaches the second server again (spec/README.md).
\* nightly: 9,004,551 states, which TLC took 12 minutes over on ten cores of an Apple M1 Pro while
\* other work ran. CI checks it once a day (.github/workflows/tla-nightly.yml), and every
\* configuration without this line on each push.
CONSTANTS
    Servers = 2
    Slots = 1
    Conns = 2
    PollsMax = 1000
    TimeoutTicks = 2
    UseTcp = TRUE
    PerPort = 0
    Tls = TRUE
    Request = FALSE
    Channel = FALSE
    OpsMax = 3
    FailuresMax = 1
    SentMax = 3
INIT Init
NEXT Next
INVARIANT Clean
CHECK_DEADLOCK FALSE
