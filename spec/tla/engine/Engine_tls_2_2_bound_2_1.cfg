\* expect: holds
\* TLS, two lookups on a connection for each server (§21, TLS rule 6). At two operations and no
\* failure TLC counted 1,315,522 states, 1,687,238 once a refusal said its alert (2026-09-27,
\* c4milo/cocuyo#31), and 243,462 once a SERVFAIL counted against its server (2026-10-08,
\* c4milo/cocuyo#37), the second server out of its reach: every way to the next server records a
\* failure. At one failure since 2026-10-09 it reaches the second server again (spec/README.md).
\* nightly: 21,536,161 states since the idle close's wait bounds a connection that closes
\* (2026-10-20, TLS rule 5). There were 28,696,711 since a query's send lends its connection's
\* records buffer (2026-10-18, TLS rule 3), and 28,446,316 since a lookup that finds no free slot
\* waits for one that frees on its own (2026-10-18, the stream's rule 12).
\* TLC took 19 minutes over the 16,382,680 states before that, on ten cores of an Apple M1 Pro while
\* other work ran. CI checks it once a day (.github/workflows/tla-nightly.yml), and every
\* configuration without this line on each push.
CONSTANTS
    Servers = 2
    Slots = 2
    Conns = 2
    PollsMax = 1000
    TimeoutTicks = 2
    UseTcp = TRUE
    PerPort = 0
    Tls = TRUE
    Request = FALSE
    Channel = FALSE
    OpsMax = 2
    FailuresMax = 1
    SentMax = 3
INIT Init
NEXT Next
INVARIANT Clean
CHECK_DEADLOCK FALSE
