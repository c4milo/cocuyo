\* expect: holds
\* UDP with answers that may come truncated: TC set, or the datagram cut by its buffer, each of
\* which sends its lookup to TCP on the same server (docs/design.md §7, §19 step 13, the datagram's
\* rule 6). One lookup, one connection, a port replaced every two queries. Added on 2026-10-14
\* (spec/README.md). TLC counted 426,197 states until a lookup that finds no free slot waited for
\* one that frees on its own, and 451,556 then. Since the lookup closes, in the clear, a connect
\* that no lookup is on, it counted 427,125 (2026-10-18, the stream's rule 12). Since a deadline
\* ends `tcpReady`, it counts 466,646 (2026-10-24, §16 decision 52).
CONSTANTS
    Servers = 2
