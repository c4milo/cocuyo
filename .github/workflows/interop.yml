# Every transport the engine speaks against an independent server, on the loopback
# (c4milo/cocuyo#16, #20 and #21), once a day and on demand: `tools/interop/run.sh` runs the
# engine against AdGuard's dnsproxy over plain DNS on UDP and on TCP, over DoT with chapulin's TCP
# session, and over DoQ and DoH on HTTP/3 with colibri's QUIC and HTTP/3 and chapulin's QUIC
# session. colibri's `tls` module carries both of chapulin's objects, and the build fetches colibri
# at the commit build.zig.zon pins.
# dnsproxy's DNS is miekg/dns, its TLS Go's, and its QUIC and HTTP/3 quic-go's. The check makes its
# own certificates, and dnsproxy answers addresses from a hosts file and every other type from a
# zone of the check's own, so it needs no network once its tools are fetched.
#
# It is not a gate, which needs no dnsproxy. Every other test of the engine runs it against
# cocuyo's own twin or colibri's own server, and the live checks depend on public servers: this is
# the one that runs an implementation written elsewhere, on the runner alone.
#
# Zig is pinned as ci.yml pins it, and dnsproxy at a release, checked against the SHA-256 of its
# archive: AdGuard publishes none, so this is the one computed when the release was pinned
# (CLAUDE.md, Ask before). No third-party action runs here; `actions/checkout` is GitHub's own.
name: interop

on:
  schedule:
    - cron: "37 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_VERSION: "0.16.0"
  DNSPROXY_VERSION: "v0.85.0"

jobs:
  interop:
    name: macOS, every transport against dnsproxy on the loopback
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig
        run: |
          set -euo pipefail
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz"
          sha="b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489"
          curl -fsSL "$url" -o zig.tar.xz
          echo "$sha  zig.tar.xz" | shasum -a 256 -c -
          tar -xf zig.tar.xz
          echo "$PWD/zig-aarch64-macos-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - run: zig version
      - name: Fetch dnsproxy
        run: |
          set -euo pipefail
          url="https://github.com/AdguardTeam/dnsproxy/releases/download/${DNSPROXY_VERSION}/dnsproxy-darwin-arm64-${DNSPROXY_VERSION}.tar.gz"
          sha="64c2a6c2645745e24369f21c9e22661a18bfcfdcbdd8ff54af0d37328b3ea9e6"
          curl -fsSL "$url" -o "$RUNNER_TEMP/dnsproxy.tar.gz"
          echo "$sha  $RUNNER_TEMP/dnsproxy.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/dnsproxy.tar.gz" -C "$RUNNER_TEMP"
      - name: The interop check
        run: tools/interop/run.sh "$RUNNER_TEMP/darwin-arm64/dnsproxy"
