# What runs on every push to main and every pull request.
#
# Two gates run everywhere, and they are the gate a developer runs by hand:
#
#   - `macos` and `linux`: `zig build test`, which is the lint over the tree and over the canary
#     that holds one violation of each rule, the module graph check, the hook check, every
#     module's unit tests, the engine on the deterministic twin of `src/sim/`, the DoT and DoQ
#     sessions' tests over colibri's `tls` and a build of their examples, the tools' own tests,
#     the bench compile and the format check. It needs no network service and no kernel
#     feature: the twin is a virtual clock and a virtual network, so the same run happens on both.
#     Then two engines on two threads resolve at once over the kernel's loops, kqueue on macOS and
#     io_uring on Linux, against a responder on the loopback (docs/design.md §24 step 6). On Linux
#     last, pepegrillo's `instructions` tool holds each case of `bench/count.zig` to the
#     instructions one operation takes, in `bench/instructions.zon`, under cachegrind. A count is
#     the same on a busy runner as on a quiet one, so it gates the commit where a time cannot. When
#     it fails, the job prints the counts as they stand, for a developer whose machine has no
#     valgrind to commit when the move is meant.
#
#   - `engine`: the engine of docs/design.md §19 step 13 over rotor itself, and the comparison
#     against c-ares, on the runner's kernel, where rotor runs io_uring.
#
#     It runs the comparison's tests twice, the second time under ThreadSanitizer, which sees
#     an access two threads share that nothing orders. The build first runs a planted race and
#     requires the report, because on Zig 0.16's default Debug backend the sanitizer instruments
#     nothing and says nothing (docs/mutations.md T1). The two-engine example runs under it too,
#     with every module of cocuyo's and the engine's instrumented.
#
#   - `epoll`: the rotor example resolves inside a container where io_uring is refused, once under
#     Docker's default seccomp profile and once under a profile that refuses every io_uring call,
#     so rotor, since 0.3.0, falls back to epoll for the whole process (tools/epoll_check/run.sh).
#     It needs no network: a recorder in the container answers the one name asked.
#
#   - `spec`: `zig build spec`, the Lean proofs of the lookup's state machine and the replay of
#     every transition the model reaches against the code, and TLC's walks of the engine model
#     replayed against the engine (spec/README.md). Lean and TLC are tools the gate must not
#     require, so the two gates above replay only the committed slices.
#
#   - `tla`: `zig build tla` over every configuration of the engine model and every mutant of it,
#     but those whose header says `\* nightly:`. A job of its own beside `spec`, since each is mostly
#     TLC on the runner's four cores. The TCP configuration of two servers grew to 21 million
#     states with request rule 17, which TLC takes hours over here, so it is marked nightly and
#     `tla-nightly.yml` checks every configuration once a day.
#
#   `spec` and `tla` each cancel their own run for an earlier commit of the same branch, since a
#   model check of a commit a newer one replaced says nothing the newer one's will not, and the
#   older ones would otherwise queue behind each other for hours.
#
#   - `dnslib`: the codec's reading of every record in dnslib's captured responses, held against
#     dnslib's reading of them (tools/dnslib/run.sh, c4milo/cocuyo#22). It fetches dnslib's test
#     directory at a pinned commit and requires its tree id, so it needs the network, and the two
#     gates run only the check's own tests.
#
#   - `coverage`: `zig build coverage`, every module's tests under kcov, built here from its
#     pinned release since Ubuntu 24.04 packages none. The table goes on the run page, and on main
#     the badge goes to the orphan `badges` branch, which the README shows. It is the one job with
#     a write token, and only its badge step holds it.
#
#   `engine` and `epoll` are the only jobs that open a socket of their own.
#
# **No number from CI enters docs/design.md §11.** A measured row there names the machine, the
# command and the day, and a shared runner is neither named nor quiet. What this job proves is
# that the engine works against a real kernel, not how fast it is: its tests assert that every
# lookup is answered and none fails, which is a tripwire. A speed claim comes from a quiet
# machine, as §11 says.
#
# c-ares is built here from its release tarball rather than installed from the distribution.
# Ubuntu 24.04 packages 1.27.0, which predates the `ares_dns_record` reader and `ares_query_dnsrec`
# that `bench/` is written against, so the comparison does not compile against it. Building the
# release also makes both sides of the comparison the same c-ares: 1.34.8 is what the macOS
# measurements in §11 were made against.
#
# valgrind comes from Ubuntu 24.04's archive, 3.22. The baseline records the counter it was taken
# with, and one taken with another is not compared: the counts are written anew.
#
# Zig is downloaded from ziglang.org and checked against the SHA-256 the release index published
# for 0.16.0, c-ares against the SHA-256 of its release asset, and Lean against the SHA-256 GitHub
# records for its release asset, so all three are pinned. The Lean version must be the one
# spec/lean/lean-toolchain names, and the job checks that it is. TLC's jar is pinned by SHA-256 in
# tools/tla.zig, which fetches it; the Java that runs it is the runner image's 21. No
# third-party action runs here; `actions/checkout` is GitHub's own.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_VERSION: "0.16.0"
  CARES_VERSION: "1.34.8"
  LEAN_VERSION: "4.33.0"
  KCOV_VERSION: "43"

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Zig
        run: |
          set -euo pipefail
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz"
          sha="b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489"
          curl -fsSL "$url" -o zig.tar.xz
          echo "$sha  zig.tar.xz" | shasum -a 256 -c -
          tar -xf zig.tar.xz
          echo "$PWD/zig-aarch64-macos-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - run: zig version
      - name: The whole local gate
        run: zig build test
      - name: Two engines on two threads, each on its own kqueue loop, resolve at once
        run: zig build example-threads-rotor

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Zig
        run: |
          set -euo pipefail
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          sha="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
          curl -fsSL "$url" -o zig.tar.xz
          echo "$sha  zig.tar.xz" | sha256sum -c -
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - run: zig version
      - name: The whole local gate
        run: zig build test
      - name: Two engines on two threads, each on its own io_uring loop, resolve at once
        run: zig build example-threads-rotor
      - name: Install valgrind, the counter of the instruction check
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y valgrind
      - name: Each benchmark case at the instructions one operation takes
        id: instructions
        run: zig build instructions
      - name: The counts as they stand, for bench/instructions.zon when the move is meant
        if: failure() && steps.instructions.outcome == 'failure'
        run: |
          set -euo pipefail
          zig build instructions-rewrite
          cat bench/instructions.zon

  epoll:
    name: Linux, the rotor example where io_uring is refused
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Zig
        run: |
          set -euo pipefail
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          sha="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
          curl -fsSL "$url" -o zig.tar.xz
          echo "$sha  zig.tar.xz" | sha256sum -c -
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - run: zig version
      - name: The rotor example resolves over epoll, with io_uring refused
        run: tools/epoll_check/run.sh

  engine:
    name: Linux, the engine over rotor and c-ares
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Zig
        run: |
          set -euo pipefail
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          sha="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
          curl -fsSL "$url" -o zig.tar.xz
          echo "$sha  zig.tar.xz" | sha256sum -c -
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - run: zig version
      - name: Build c-ares
        run: |
          set -euo pipefail
          url="https://github.com/c-ares/c-ares/releases/download/v${CARES_VERSION}/c-ares-${CARES_VERSION}.tar.gz"
          sha="c222b6d681096f9444d2c4863d2c1174019e27cacca0a4a5c114d36dd7d7bf78"
          curl -fsSL "$url" -o cares.tar.gz
          echo "$sha  cares.tar.gz" | sha256sum -c -
          tar -xf cares.tar.gz
          cmake -S "c-ares-${CARES_VERSION}" -B cares-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/cares-prefix" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCARES_BUILD_TESTS=OFF \
            -DCARES_BUILD_TOOLS=OFF
          cmake --build cares-build --parallel
          cmake --install cares-build
          echo "CARES_PREFIX=$PWD/cares-prefix" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PWD/cares-prefix/lib" >> "$GITHUB_ENV"
      - name: The comparison's own tests, and the engine against a real kernel
        run: zig build test-cares "-Dcares=$CARES_PREFIX"
      - name: The same tests under ThreadSanitizer, after a race it must report
        run: zig build test-cares "-Dcares=$CARES_PREFIX" -Dsanitize-thread=true
      - name: Two engines on two threads under ThreadSanitizer, every module instrumented
        run: zig build example-threads-rotor -Dsanitize-thread=true
      - name: The comparison, for the log and not for the record
        run: zig build bench-cares "-Dcares=$CARES_PREFIX"

  spec:
    name: Linux, the Lean and TLA+ models against the code
    runs-on: ubuntu-24.04
    # A push to a branch cancels the run it replaces. On main a run already going finishes, and
    # the newest push waits behind it: from 2f30feb on, each push cancelled the run before it.
    concurrency:
      group: spec-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Zig
        run: |
          set -euo pipefail
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          sha="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
          curl -fsSL "$url" -o zig.tar.xz
          echo "$sha  zig.tar.xz" | sha256sum -c -
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - name: Install Lean
        run: |
          set -euo pipefail
          grep -qx "leanprover/lean4:v${LEAN_VERSION}" spec/lean/lean-toolchain
          url="https://github.com/leanprover/lean4/releases/download/v${LEAN_VERSION}/lean-${LEAN_VERSION}-linux.tar.zst"
          sha="4b3fb03c29a1e0a253fb1d11f9bae3725f19a0dc6fc09b3ea16d2c9df3349e2c"
          curl -fsSL "$url" -o lean.tar.zst
          echo "$sha  lean.tar.zst" | sha256sum -c -
          tar --zstd -xf lean.tar.zst
          echo "$PWD/lean-${LEAN_VERSION}-linux/bin" >> "$GITHUB_PATH"
      - name: Use the image's Java 21, for TLC
        run: echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - run: zig version && lean --version && java -version
      - name: The proofs, the committed slices, and the whole transcripts replayed
        run: zig build spec

  tla:
    name: Linux, the engine model checked by TLC
    runs-on: ubuntu-24.04
    # A push to a branch cancels the run it replaces. On main a run already going finishes, and
    # the newest push waits behind it: from 2f30feb on, each push cancelled the run before it.
    concurrency:
      group: tla-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Zig
        run: |
          set -euo pipefail
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          sha="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
          curl -fsSL "$url" -o zig.tar.xz
          echo "$sha  zig.tar.xz" | sha256sum -c -
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - name: Use the image's Java 21, for TLC
        run: echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - run: zig version && java -version
      - name: The engine model checked by TLC, and its mutants refused, but for what runs nightly
        run: |
          set -euo pipefail
          # What `zig build tla` finds with no argument: each model's configurations and its
          # mutants, and not the walk configurations under trace/.
          configurations=$(for cfg in spec/tla/*/*.cfg spec/tla/*/mutants/*.cfg; do
            grep -q '^\\\* nightly:' "$cfg" || echo "$cfg"
          done)
          zig build tla -- $configurations

  dnslib:
    name: Linux, the codec against dnslib's reading of responses real servers sent
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Zig
        run: |
          set -euo pipefail
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          sha="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
          curl -fsSL "$url" -o zig.tar.xz
          echo "$sha  zig.tar.xz" | sha256sum -c -
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - run: zig version
      - name: Every record of dnslib's captured responses, read by the codec and by dnslib
        run: tools/dnslib/run.sh

  coverage:
    name: Linux, line coverage of the library and the engine
    runs-on: ubuntu-24.04
    # The badge step pushes the regenerated SVG to the badges branch, so this job alone gets write.
    permissions:
      contents: write
    concurrency:
      group: coverage-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          # The one job with a write token keeps it out of .git/config, where the build could read
          # it: only the badge step's push carries it, from its own environment.
          persist-credentials: false
      - name: Install Zig
        run: |
          set -euo pipefail
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          sha="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
          curl -fsSL "$url" -o zig.tar.xz
          echo "$sha  zig.tar.xz" | sha256sum -c -
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - name: Build kcov from its release, pinned
        # Ubuntu 24.04 packages no kcov, so it is built from the release archive, checked against
        # the SHA-256 computed when the release was pinned.
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends binutils-dev libdw-dev libelf-dev libcurl4-openssl-dev zlib1g-dev libssl-dev
          url="https://github.com/SimonKagstrom/kcov/archive/refs/tags/v${KCOV_VERSION}.tar.gz"
          sha="4cbba86af11f72de0c7514e09d59c7927ed25df7cebdad087f6d3623213b95bf"
          curl -fsSL "$url" -o kcov.tar.gz
          echo "$sha  kcov.tar.gz" | sha256sum -c -
          tar -xzf kcov.tar.gz
          cmake -S "kcov-${KCOV_VERSION}" -B "$RUNNER_TEMP/kcov" -DCMAKE_BUILD_TYPE=Release > /dev/null
          cmake --build "$RUNNER_TEMP/kcov" -j4 > /dev/null
          echo "$RUNNER_TEMP/kcov/src" >> "$GITHUB_PATH"
      - run: zig version && kcov --version
      - name: Every module's tests under kcov, and the report
        run: zig build coverage
      - name: The table on the run page
        run: cat zig-out/coverage/coverage.md >> "$GITHUB_STEP_SUMMARY"
      - name: Update the coverage badge branch
        # The badge is a generated SVG on an orphan branch, so this job never pushes to main. The
        # README links it from there.
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp zig-out/coverage/coverage.svg "$RUNNER_TEMP/coverage.svg"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --quiet origin badges 2>/dev/null; then
            git switch --quiet badges
          else
            git switch --quiet --orphan badges
          fi
          mkdir -p .github/badges
          cp "$RUNNER_TEMP/coverage.svg" .github/badges/coverage.svg
          if ! git ls-files --error-unmatch .github/badges/coverage.svg > /dev/null 2>&1 ||
              ! git diff --quiet -- .github/badges/coverage.svg; then
            git add .github/badges/coverage.svg
            git commit --quiet -m "chore: update the coverage badge"
            git push --quiet "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" badges
          fi
      - name: kcov's own report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: zig-out/coverage/html/
          if-no-files-found: ignore
