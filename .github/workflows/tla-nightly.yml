# Every TLC configuration of the engine model, once a day and on demand: `zig build tla` with no
# argument. CI's `tla` job checks every configuration but those whose header says `\* nightly:`,
# since the TCP configuration of two servers has 21 million states and TLC takes hours over it on
# the runner's four cores (docs/design.md §24, request rule 17). This is where it is checked.
#
# Zig is pinned as ci.yml pins it. TLC's jar is pinned by SHA-256 in tools/tla.zig, which fetches
# it; the Java that runs it is the runner image's 21. No third-party action runs here;
# `actions/checkout` is GitHub's own.
name: tla-nightly

on:
  schedule:
    - cron: "11 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_VERSION: "0.16.0"

jobs:
  tla:
    name: Linux, every configuration of the engine model checked by TLC
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - name: Install Zig
        run: |
          set -euo pipefail
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          sha="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
          curl -fsSL "$url" -o zig.tar.xz
          echo "$sha  zig.tar.xz" | sha256sum -c -
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - name: Use the image's Java 21, for TLC
        run: echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - run: zig version && java -version
      - name: Every configuration of the engine model checked by TLC, and its mutants refused
        run: zig build tla
