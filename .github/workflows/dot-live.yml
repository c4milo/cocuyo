# DNS over TLS, live (docs/design.md §21 step 6), once a day and on demand: `tools/dot_live/run.sh`
# resolves through the public resolvers that serve DoT, resumes a ticket over a second connection,
# and refuses what strict mode refuses. It runs on macOS, whose system root store the check reads
# each resolver's root from, against chapulin at the commit below, built as build/dot.zig says.
#
# It is not a gate, because it depends on three public resolvers and the network. A failure here
# can be a resolver changing what it does, as dns.google's refusal of a resumed hello without
# signature schemes was (docs/design.md §21 step 6), or the network failing.
#
# Zig is pinned as ci.yml pins it, and chapulin is cloned at a pinned commit, the first that names
# its transports for what TLS runs over and who does the I/O, and each object's build record after
# its transport: `ch_build_info_tcp_nonblocking` here, which `io/io_chapulin.zig` compares with its
# headers. No third-party action runs here;
# `actions/checkout` is GitHub's own.
name: dot-live

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_VERSION: "0.16.0"
  CHAPULIN_COMMIT: "ca803517a209624ab893d851bc651bc2f2c007a9"

jobs:
  live:
    name: macOS, DNS over TLS against the public resolvers
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig
        run: |
          set -euo pipefail
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz"
          sha="b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489"
          curl -fsSL "$url" -o zig.tar.xz
          echo "$sha  zig.tar.xz" | shasum -a 256 -c -
          tar -xf zig.tar.xz
          echo "$PWD/zig-aarch64-macos-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - name: Build chapulin's non-blocking TCP object
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/c4milo/chapulin.git "$RUNNER_TEMP/chapulin"
          git -C "$RUNNER_TEMP/chapulin" checkout --quiet "$CHAPULIN_COMMIT"
          make -C "$RUNNER_TEMP/chapulin" RAND=extern TRUST=webpki TRANSPORT=tcp-nonblocking lib
          cp "$RUNNER_TEMP/chapulin/bin/chapulin.o" "$RUNNER_TEMP/chapulin/bin/chapulin-tcp-nonblocking.o"
      - run: zig version
      - name: The session's tests, then the live check
        run: |
          set -euo pipefail
          zig build "-Dchapulin=$RUNNER_TEMP/chapulin" test-chapulin
          tools/dot_live/run.sh "$RUNNER_TEMP/chapulin"
