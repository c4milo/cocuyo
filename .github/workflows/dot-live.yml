# DNS over TLS, live (docs/design.md §21 step 6), once a day and on demand: `tools/dot_live/run.sh`
# resolves through the public resolvers that serve DoT, resumes a ticket over a second connection,
# and refuses what strict mode refuses. It runs on macOS, whose system root store the check reads
# each resolver's roots from, against colibri at the commit build.zig.zon pins (build/dot.zig).
#
# It is not a gate, because it depends on three public resolvers and the network. A failure here
# can be a resolver changing what it does, as dns.google's refusal of a resumed hello without
# signature schemes was (docs/design.md §21 step 6), or the network failing.
#
# Zig is pinned as ci.yml pins it. colibri is a dependency the build fetches at the commit
# build.zig.zon pins, checked by its hash, and its `tls` takes chapulin's objects from stdx at the
# commit colibri pins. Each resolver resolves in one run, whose example detects the CPU's features
# through that stdx (docs/design.md §16 decision 48, as amended on 2026-11-26). On a runner whose
# sysctl does not report FEAT_AES, FEAT_PMULL and FEAT_DIT as 1, each run fails. No third-party action runs
# here; `actions/checkout` and `actions/upload-artifact` are GitHub's own. Each run keeps its
# packets to and from Quad9 for 14 days (https://github.com/c4milo/cocuyo/issues/60).
name: dot-live

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_VERSION: "0.16.0"

jobs:
  live:
    name: macOS, DNS over TLS against the public resolvers
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Zig
        run: |
          set -euo pipefail
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz"
          sha="b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489"
          curl -fsSL "$url" -o zig.tar.xz
          echo "$sha  zig.tar.xz" | shasum -a 256 -c -
          tar -xf zig.tar.xz
          echo "$PWD/zig-aarch64-macos-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - run: zig version
      # Quad9 closes some connections before the handshake ends
      # (https://github.com/c4milo/cocuyo/issues/60). The job keeps the packets to and from
      # 9.9.9.9 on port 853, so a failure carries the closed handshake. The capture holds no key, so
      # every record after the hellos stays encrypted in it.
      - name: Capture the packets to and from Quad9
        run: |
          set -euo pipefail
          interface=$(route -n get 9.9.9.9 | awk '/interface:/ { print $2 }')
          sudo tcpdump -i "$interface" -U -s 0 -w "$RUNNER_TEMP/quad9.pcap" \
            'host 9.9.9.9 and tcp port 853' > "$RUNNER_TEMP/tcpdump.log" 2>&1 &
          sleep 2
          cat "$RUNNER_TEMP/tcpdump.log"
      - name: The session's tests, then the live check
        run: |
          set -euo pipefail
          zig build test-chapulin
          tools/dot_live/run.sh
      - name: Stop the capture
        if: always()
        run: |
          sudo pkill -INT -x tcpdump || true
          sleep 2
          sudo chmod a+r "$RUNNER_TEMP/quad9.pcap" || true
          ls -l "$RUNNER_TEMP/quad9.pcap" || true
      - name: Keep the capture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quad9-capture
          path: ${{ runner.temp }}/quad9.pcap
          if-no-files-found: ignore
          retention-days: 14
