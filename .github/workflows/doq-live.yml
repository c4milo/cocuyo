# DNS over QUIC, live (docs/design.md §24 step 4), once a day and on demand: `tools/doq_live/run.sh`
# resolves through the public resolvers that serve DoQ, over colibri's QUIC with chapulin's QUIC
# session in colibri's `tls` as its TLS, resumes a ticket over a second connection, and refuses
# what strict mode refuses. It runs on macOS, whose system root store the check reads each
# resolver's root from, against colibri at the commit build.zig.zon pins (build/doq.zig).
#
# It is not a gate, because it depends on two public resolvers and the network. A failure here can
# be a resolver changing what it does, or the network failing.
#
# Zig is pinned as ci.yml pins it. colibri is a dependency the build fetches at the commit
# build.zig.zon pins, checked by its hash, and its `tls` module carries chapulin's objects at the
# commit colibri pins. No third-party action runs here; `actions/checkout` is GitHub's own.
name: doq-live

on:
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_VERSION: "0.16.0"

jobs:
  live:
    name: macOS, DNS over QUIC against the public resolvers
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Zig
        run: |
          set -euo pipefail
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz"
          sha="b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489"
          curl -fsSL "$url" -o zig.tar.xz
          echo "$sha  zig.tar.xz" | shasum -a 256 -c -
          tar -xf zig.tar.xz
          echo "$PWD/zig-aarch64-macos-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - run: zig version
      - name: The session's tests, then the live check
        run: |
          set -euo pipefail
          zig build test-chapulin-quic
          tools/doq_live/run.sh
